
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace}
#root{display:flex;flex-direction:column;align-items:center;padding:.5rem 0}
#hud{display:flex;justify-content:space-between;align-items:flex-end;width:640px;padding:3px 0 5px}
.hi{font-size:10px;font-weight:500;color:#aaa;letter-spacing:.06em;text-transform:uppercase}
.hv{font-size:15px;font-weight:500;color:#fff;line-height:1.2}
#sbar-w{width:80px}
#sbar{height:5px;background:#378ADD;border-radius:3px}
canvas{display:block;border-radius:10px;border:.5px solid #333;background:#07071a}
#cw{position:relative}
#ov{position:absolute;top:0;left:0;width:640px;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;pointer-events:none;background:rgba(7,7,26,.9)}
.ot{font-size:26px;font-weight:500;color:#fff;letter-spacing:.1em;margin-bottom:5px;text-align:center}
.os{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:5px;text-align:center;line-height:1.7}
.obtn{pointer-events:all;border:none;color:#fff;font-size:12px;font-family:monospace;padding:9px 24px;border-radius:7px;cursor:pointer;letter-spacing:.05em;margin-top:6px;transition:opacity .15s}
.obtn:hover{opacity:.8}
#pu-disp{display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:180px}
.pui{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:500}
#mc{display:flex;gap:6px;justify-content:center;width:640px;padding:6px 0 2px}
.mb{border:none;border-radius:7px;padding:9px 0;font-size:12px;cursor:pointer;font-family:monospace;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cdsp{position:absolute;top:7px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:500;color:#FAC775;opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:.08em;white-space:nowrap}

/* LEVEL SELECT */
#lsel{display:none;flex-direction:column;align-items:center;padding:.5rem 0;width:640px}
#lsel-title{font-size:22px;font-weight:500;color:#fff;letter-spacing:.1em;margin-bottom:4px;text-align:center}
#lsel-sub{font-size:12px;color:#777;margin-bottom:12px;text-align:center}
#lsel-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:640px}
.lcell{border-radius:7px;padding:7px 4px;text-align:center;cursor:pointer;border:.5px solid #333;transition:border-color .15s,background .15s;position:relative}
.lcell:hover{border-color:#777}
.lcell.locked{opacity:.35;cursor:default}
.lcell.boss-cell{border-color:#E24B4A55}
.lcell.ultimate-cell{border-color:#FAC77599}
.lcell.cleared{border-color:#1D9E7588}
.lcell .lnum{font-size:11px;font-weight:500;color:#888;margin-bottom:2px}
.lcell .lname{font-size:9px;color:#666;line-height:1.3}
.lcell .lico{font-size:16px;margin-bottom:1px}
.lcell.boss-cell .lnum{color:#E24B4A}
.lcell.ultimate-cell .lnum{color:#FAC775}
.lcell.cleared .lnum{color:#5DCAA5}
#lsel-back{margin-top:10px;background:transparent;border:.5px solid #444;color:#aaa;font-size:11px;font-family:monospace;padding:7px 18px;border-radius:6px;cursor:pointer}
#lsel-back:hover{border-color:#888;color:#fff}
</style>

<div id="root">
  <h2 style="position:absolute;left:-9999px">Space Blaster — 30-level arcade shooter with level select</h2>

  <!-- LEVEL SELECT SCREEN -->
  <div id="lsel">
    <div id="lsel-title">SELECT LEVEL</div>
    <div id="lsel-sub">Bosses every 5 levels &nbsp;|&nbsp; Level 30: The Void Sovereign</div>
    <div id="lsel-grid"></div>
    <button id="lsel-back" onclick="showMenu()">BACK TO MENU</button>
  </div>

  <!-- GAME -->
  <div id="game-ui" style="display:none;flex-direction:column;align-items:center">
    <div id="hud">
      <div class="hi">Level<div class="hv" id="ldisp">1</div></div>
      <div class="hi">Score<div class="hv" id="sd">0</div></div>
      <div class="hi">Hi<div class="hv" id="hsd">0</div></div>
      <div class="hi">Combo<div class="hv" id="cd">x1</div></div>
      <div class="hi"><div style="font-size:9px;color:#aaa;margin-bottom:2px">Shield</div><div id="sbar-w"><div id="sbar" style="width:100%"></div></div></div>
      <div class="hi">Lives<div class="hv" id="ld">❤❤❤</div></div>
      <div class="hi">Power-ups<div id="pu-disp"></div></div>
    </div>
    <div id="cw">
      <canvas id="gc" width="640" height="500"></canvas>
      <div id="cdsp"></div>
      <div id="ov">
        <div class="ot" id="ot">SPACE BLASTER</div>
        <div class="os" id="os">Select a level to begin</div>
        <button class="obtn" id="ob" style="background:#534AB7" onclick="handleOvBtn()">START</button>
        <button class="obtn" style="background:#333;margin-top:4px" onclick="showLevelSelect()">LEVEL SELECT</button>
      </div>
    </div>
    <div id="mc">
      <button class="mb" id="bl" style="background:#3C3489;width:85px" onmousedown="keys['ArrowLeft']=true" onmouseup="keys['ArrowLeft']=false" ontouchstart="keys['ArrowLeft']=true" ontouchend="keys['ArrowLeft']=false">◀ LEFT</button>
      <button class="mb" id="bsh" style="background:#1D9E75;width:115px">SHOOT</button>
      <button class="mb" style="background:#993C1D;width:95px" onmousedown="doBomb()" ontouchstart="doBomb()">BOMB</button>
      <button class="mb" id="br" style="background:#3C3489;width:85px" onmousedown="keys['ArrowRight']=true" onmouseup="keys['ArrowRight']=false" ontouchstart="keys['ArrowRight']=true" ontouchend="keys['ArrowRight']=false">RIGHT ▶</button>
    </div>
  </div>
</div>

<script>
const TOTAL_LEVELS=30;
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
const W=640,H=500;

let gstate='menu';
let score=0,hiScore=0,lives=3,shield=100,combo=1,comboTimer=0;
let currentLevel=1,clearedLevels=new Set();
let player,bullets,enemies,particles,eBullets,stars,powerups;
let keys={},shootCD=0,eBulletTimer=0,eMoveTimer=0,eDir=1;
let animId,bossActive=false,boss=null,bossHP=0,bossMaxHP=0;
let waveTransition=false;
let screenFlash=0,screenFlashCol='#fff';
let activePowerups={};
let laserBeam=null,laserTimer=0;
let mobileShootHeld=false,mobileShootTimer=0;
let ultimatePhase=0,ultimateAngle=0,ultimateSatellites=[];
let bossTimers={};
let lastTime=0;

const PU_TYPES=['triple','rapid','spread','shield','bomb','laser'];
const C={player:'#5DCAA5',bullet:'#FAC775',e1:'#7F77DD',e2:'#D85A30',e3:'#D4537E',boss:'#E24B4A',bossAccent:'#FAC775',shield:'#378ADD',px:['#FAC775','#5DCAA5','#7F77DD','#D85A30','#D4537E','#85B7EB','#EF9F27'],pu:{triple:'#7F77DD',rapid:'#5DCAA5',spread:'#FAC775',shield:'#378ADD',bomb:'#D85A30',laser:'#D4537E'}};

const LEVEL_DEFS=[];
for(let i=1;i<=30;i++){
  const isBoss=i%5===0;
  const isUltimate=i===30;
  const tier=Math.ceil(i/5);
  LEVEL_DEFS.push({
    num:i,
    isBoss,isUltimate,
    name:isUltimate?'The Void Sovereign':isBoss?['Warlord Rex','Titan Zorg','Nebula Dread','Hydra Prime','Omega Wraith','VOID SOVEREIGN'][Math.floor(i/5)-1]||'Boss':['Scouts','Raiders','Drones','Snipers','Ambush','Swarm','Blitz','Phantoms','Vanguard','Onslaught','Siege','Eclipse','Tempest','Havoc','Chaos','Barrage','Storm','Fury','Carnage','Oblivion','Rupture','Collapse','Singularity','Void Rift'][i-Math.ceil(i/5)-1]||'Wave '+i,
    rows:Math.min(2+Math.floor(i/3),6),
    cols:Math.min(8+Math.floor(i/6),10),
    enemySpeedMult:1+i*.08,
    enemyFireMult:1+i*.1,
    bossHP:isBoss?(60+i*25):0,
    bgColor:['#07071a','#070a1a','#0a071a','#071a0a','#1a070a','#1a0a07'][tier-1]||'#07071a',
    starColor:['#fff','#adf','#daf','#afd','#fda','#fad'][tier-1]||'#fff',
    enemyColors:tier===1?[C.e1,C.e1,C.e1]:tier===2?[C.e2,C.e1,C.e2]:tier===3?[C.e3,C.e2,C.e1]:tier===4?['#D4537E','#D85A30','#7F77DD']:tier===5?['#E24B4A','#D4537E','#D85A30']:['#FF4400','#E24B4A','#D4537E'],
    bossColors:['#7F77DD','#D85A30','#D4537E','#E24B4A','#FF4400','#FFD700'][Math.floor(i/5)-1]||'#E24B4A'
  });
}

function levelDef(n){return LEVEL_DEFS[n-1]||LEVEL_DEFS[0];}

function rc(){return C.px[Math.floor(Math.random()*C.px.length)];}
function rnd(a,b){return a+Math.random()*(b-a);}

function initStars(bgCol,starCol){
  stars=Array.from({length:110},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.3,1.8),spd:rnd(.1,.6),alpha:rnd(.2,.7),twinkle:rnd(0,Math.PI*2),col:starCol||'#fff'}));
}

function showMenu(){
  document.getElementById('lsel').style.display='none';
  document.getElementById('game-ui').style.display='none';
  document.getElementById('lsel').style.display='none';
  const gameUI=document.getElementById('game-ui');
  gameUI.style.display='flex';
  document.getElementById('ov').style.display='flex';
  document.getElementById('ot').textContent='SPACE BLASTER';
  document.getElementById('ot').style.color='#fff';
  document.getElementById('os').innerHTML='← → move &nbsp;|&nbsp; Space shoot &nbsp;|&nbsp; B bomb<br>30 levels · bosses · ultimate final boss';
  document.getElementById('ob').textContent='PLAY FROM L1';
  document.getElementById('ob').style.background='#534AB7';
  document.getElementById('ob').onclick=()=>startLevel(1);
  gstate='menu';
  initStars('#07071a','#fff');
  renderMenuCanvas();
}

function showLevelSelect(){
  document.getElementById('lsel').style.display='flex';
  document.getElementById('game-ui').style.display='none';
  buildLevelGrid();
}

function buildLevelGrid(){
  const grid=document.getElementById('lsel-grid');
  grid.innerHTML='';
  for(let i=1;i<=TOTAL_LEVELS;i++){
    const def=levelDef(i);
    const cell=document.createElement('div');
    const unlocked=i===1||clearedLevels.has(i-1)||clearedLevels.size>=i-1;
    cell.className='lcell'+(def.isUltimate?' ultimate-cell':def.isBoss?' boss-cell':'')+(clearedLevels.has(i)?' cleared':'')+(unlocked?'':' locked');
    const ico=def.isUltimate?'☠':def.isBoss?'★':'·';
    cell.innerHTML=`<div class="lico" style="color:${def.isUltimate?'#FAC775':def.isBoss?'#E24B4A':'#7F77DD'}">${ico}</div><div class="lnum">${i}</div><div class="lname">${def.name}</div>`;
    if(unlocked) cell.onclick=()=>{document.getElementById('lsel').style.display='none';startLevel(i);};
    grid.appendChild(cell);
  }
}

function startLevel(n){
  currentLevel=n;
  const def=levelDef(n);
  document.getElementById('lsel').style.display='none';
  const gui=document.getElementById('game-ui');
  gui.style.display='flex';
  document.getElementById('ov').style.display='none';
  score=0;lives=3;shield=100;combo=1;comboTimer=0;
  activePowerups={};laserBeam=null;laserTimer=0;screenFlash=0;
  initStars(def.bgColor,def.starColor);
  setupLevel(n);
  updateHUD();
  gstate='playing';
  lastTime=performance.now();
  cancelAnimationFrame(animId);
  animId=requestAnimationFrame(gameLoop);
}

function setupLevel(n){
  const def=levelDef(n);
  waveTransition=false;bossActive=false;boss=null;
  player={x:W/2,y:H-55,w:34,h:30,speed:4.5,invincible:0};
  bullets=[];eBullets=[];particles=[];powerups=[];
  shootCD=0;eMoveTimer=0;eDir=1;eBulletTimer=0;
  activePowerups={};laserBeam=null;laserTimer=0;
  ultimatePhase=0;ultimateAngle=0;ultimateSatellites=[];bossTimers={};
  document.getElementById('ldisp').textContent=n+(def.isUltimate?' ☠':def.isBoss?' ★':'');

  if(def.isBoss){
    spawnBoss(def);return;
  }
  enemies=[];
  for(let r=0;r<def.rows;r++){
    for(let c=0;c<def.cols;c++){
      const type=r===0?3:r<=1?2:1;
      const col=def.enemyColors[type-1]||C.e1;
      const spacing=Math.floor((W-60)/def.cols);
      enemies.push({x:40+c*spacing,y:44+r*44,w:30,h:24,type,alive:true,wobble:0,hp:type===3?2:1,maxHp:type===3?2:1,col});
    }
  }
}

function spawnBoss(def){
  bossActive=true;enemies=[];
  bossMaxHP=def.bossHP;bossHP=bossMaxHP;
  const col=def.bossColors||'#E24B4A';
  if(def.isUltimate){
    boss={x:W/2,y:110,w:130,h:90,dir:1,speed:.8,shootTimer:0,moveTimer:0,col,phase:0};
    initUltimateSatellites();
  } else {
    const bossNum=Math.floor(def.num/5);
    boss={x:W/2,y:90,w:100+bossNum*8,h:65+bossNum*4,dir:1,speed:1+bossNum*.2,shootTimer:0,moveTimer:0,col,bossNum};
  }
}

function initUltimateSatellites(){
  ultimateSatellites=[];
  for(let i=0;i<4;i++){
    ultimateSatellites.push({angle:i*Math.PI/2,dist:130,hp:25,maxHp:25,alive:true,orbitSpeed:.015});
  }
}

function handleOvBtn(){
  const btn=document.getElementById('ob');
  if(gstate==='gameover'||gstate==='levelclear'){
    if(gstate==='levelclear') startLevel(Math.min(currentLevel+1,30));
    else startLevel(currentLevel);
  } else {
    startLevel(1);
  }
}

function doShoot(){if(gstate!=='playing')return;if(shootCD>0)return;fireBullet();shootCD=activePowerups.rapid?6:13;}
function doBomb(){if(gstate!=='playing')return;if(!activePowerups.bomb)return;triggerBomb();}

function fireBullet(){
  if(activePowerups.laser){laserBeam={x:player.x,y:player.y-player.h/2};laserTimer=22;return;}
  if(activePowerups.triple){
    bullets.push({x:player.x,y:player.y-player.h/2,vx:0,vy:-11});
    bullets.push({x:player.x,y:player.y-player.h/2,vx:-2.5,vy:-10});
    bullets.push({x:player.x,y:player.y-player.h/2,vx:2.5,vy:-10});
  } else if(activePowerups.spread){
    for(let i=-2;i<=2;i++) bullets.push({x:player.x,y:player.y-player.h/2,vx:i*2.2,vy:-10});
  } else {
    bullets.push({x:player.x,y:player.y-player.h/2,vx:0,vy:-11});
  }
}

function triggerBomb(){
  delete activePowerups.bomb;screenFlash=14;screenFlashCol='#fff';
  enemies.forEach(e=>{if(!e.alive)return;spawnParticles(e.x,e.y,e.col||C.e1,14);addScore(e.type*10);e.alive=false;});
  if(bossActive&&boss){bossHP=Math.max(0,bossHP-120);spawnParticles(boss.x,boss.y,'#E24B4A',20);}
  if(bossActive&&ultimateSatellites) ultimateSatellites.forEach(s=>{if(s.alive){s.hp=Math.max(0,s.hp-15);}});
  updateHUD();
}

function addScore(pts){score+=pts*combo;if(score>hiScore)hiScore=score;updateHUD();}
function bumpCombo(){combo=Math.min(combo+1,10);comboTimer=200;showCombo();updateHUD();}
function showCombo(){
  const el=document.getElementById('cdsp');
  el.textContent=combo>1?'COMBO x'+combo+'!':'';
  el.style.opacity=combo>1?'1':'0';
}

function updateHUD(){
  document.getElementById('sd').textContent=score;
  document.getElementById('hsd').textContent=hiScore;
  document.getElementById('cd').textContent='x'+combo;
  document.getElementById('ld').textContent='❤'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives));
  const sb=document.getElementById('sbar');
  sb.style.width=Math.max(0,shield)+'%';
  sb.style.background=shield>50?C.shield:shield>25?'#EF9F27':'#E24B4A';
  const pd=document.getElementById('pu-disp');pd.innerHTML='';
  Object.keys(activePowerups).forEach(k=>{
    const d=document.createElement('span');d.className='pui';
    d.style.cssText=`background:${C.pu[k]}33;color:${C.pu[k]};border:1px solid ${C.pu[k]}66`;
    d.textContent={triple:'3x',rapid:'⚡',spread:'⬡',shield:'🛡',bomb:'💣',laser:'🔴'}[k]||k;
    pd.appendChild(d);
  });
}

function spawnParticles(x,y,col,n=12){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),s=rnd(1,5);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col||rc(),r:rnd(1,4)});
  }
}

function maybeDrop(x,y){
  if(Math.random()<.25){
    const type=PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
    powerups.push({x,y,vy:1.4,type,bob:0,life:400,collected:false});
  }
}

// ────────────────── DRAW ──────────────────
function drawBg(){
  const def=levelDef(currentLevel);
  ctx.fillStyle=def.bgColor||'#07071a';ctx.fillRect(0,0,W,H);
}

function drawStars(dt){
  stars.forEach(s=>{
    s.twinkle+=.03;s.y=(s.y+s.spd*(dt||16)*.06)%H;
    ctx.globalAlpha=Math.max(0,s.alpha*.6+Math.sin(s.twinkle)*.3);
    ctx.fillStyle=s.col||'#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });ctx.globalAlpha=1;
}

function drawPlayer(p){
  ctx.save();
  if(p.invincible>0&&Math.floor(p.invincible/4)%2===0){ctx.restore();return;}
  if(shield>0){ctx.shadowBlur=18;ctx.shadowColor=C.shield;ctx.strokeStyle=C.shield+'88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.stroke();}
  ctx.shadowBlur=14;ctx.shadowColor=C.player;ctx.fillStyle=C.player;
  ctx.beginPath();ctx.moveTo(p.x,p.y-p.h/2);ctx.lineTo(p.x-p.w/2,p.y+p.h/2);ctx.lineTo(p.x-p.w/4,p.y+p.h/4);ctx.lineTo(p.x,p.y+p.h/2-4);ctx.lineTo(p.x+p.w/4,p.y+p.h/4);ctx.lineTo(p.x+p.w/2,p.y+p.h/2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#07071a';ctx.beginPath();ctx.arc(p.x,p.y+2,5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}

function drawEnemy(e){
  if(!e.alive)return;
  const col=e.col||C.e1;
  ctx.save();ctx.shadowBlur=8;ctx.shadowColor=col;ctx.fillStyle=col;
  const x=e.x,y=e.y+Math.sin(e.wobble)*2.5;
  if(e.type===1){
    ctx.beginPath();ctx.moveTo(x,y-e.h/2);ctx.lineTo(x+e.w/2,y);ctx.lineTo(x+e.w/3,y+e.h/2);ctx.lineTo(x-e.w/3,y+e.h/2);ctx.lineTo(x-e.w/2,y);ctx.closePath();ctx.fill();
    ctx.fillStyle='#07071a';ctx.beginPath();ctx.arc(x-7,y-2,3,0,Math.PI*2);ctx.arc(x+7,y-2,3,0,Math.PI*2);ctx.fill();
  } else if(e.type===2){
    ctx.beginPath();ctx.moveTo(x,y-e.h/2);ctx.lineTo(x+e.w/2,y-e.h/4);ctx.lineTo(x+e.w/2,y+e.h/2);ctx.lineTo(x-e.w/2,y+e.h/2);ctx.lineTo(x-e.w/2,y-e.h/4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#07071a';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();
  } else {
    ctx.beginPath();ctx.arc(x,y,e.h/2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#07071a';ctx.beginPath();ctx.arc(x-5,y-2,3,0,Math.PI*2);ctx.arc(x+5,y-2,3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#07071a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y+4,4,0,Math.PI);ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.restore();
}

function drawBoss(){
  if(!boss)return;
  const def=levelDef(currentLevel);
  if(def.isUltimate){drawUltimateBoss();return;}
  const x=boss.x,y=boss.y+Math.sin(boss.moveTimer*.025)*7;
  const rage=1-bossHP/bossMaxHP;
  const col=boss.col||'#E24B4A';
  ctx.save();ctx.shadowBlur=20+rage*20;ctx.shadowColor=col;
  ctx.fillStyle=rage>.7?'#FF2200':rage>.4?col:'#AA3300';
  ctx.beginPath();ctx.ellipse(x,y,boss.w/2,boss.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FAC775';
  for(let i=0;i<Math.ceil(rage*3)+1;i++){const r=20-i*5;if(r<5)break;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#07071a';ctx.beginPath();ctx.arc(x-18,y-10,7,0,Math.PI*2);ctx.arc(x+18,y-10,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rage>.5?'#F09595':col;ctx.beginPath();ctx.arc(x-18,y-10,4,0,Math.PI*2);ctx.arc(x+18,y-10,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#07071a';ctx.beginPath();ctx.ellipse(x,y+16,18,7*(0.3+rage*.5),0,0,Math.PI);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(x-16,y+16,5,3);ctx.fillRect(x-7,y+16,5,3);ctx.fillRect(x+2,y+16,5,3);ctx.fillRect(x+10,y+16,5,3);
  ctx.fillStyle=boss.col||'#E24B4A';
  ctx.beginPath();ctx.moveTo(x-boss.w/2,y-8);ctx.lineTo(x-boss.w/2-28,y-26);ctx.lineTo(x-boss.w/2-8,y+8);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(x+boss.w/2,y-8);ctx.lineTo(x+boss.w/2+28,y-26);ctx.lineTo(x+boss.w/2+8,y+8);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
  const bw=boss.w*1.5,bh=7,bx=x-bw/2,by=y-boss.h/2-17;
  ctx.fillStyle='#222';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=rage>.6?'#E24B4A':rage>.3?'#EF9F27':'#5DCAA5';
  ctx.fillRect(bx,by,(bossHP/bossMaxHP)*bw,bh);
  ctx.strokeStyle='#444';ctx.lineWidth=.5;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.textAlign='center';
  ctx.fillText('BOSS LV'+currentLevel+' — '+def.name,x,by-3);ctx.textAlign='left';
}

function drawUltimateBoss(){
  if(!boss)return;
  const x=boss.x,y=boss.y;
  const rage=1-bossHP/bossMaxHP;
  const t=performance.now()/1000;

  ultimateSatellites.forEach((s,i)=>{
    if(!s.alive)return;
    const sx=x+Math.cos(s.angle)*s.dist,sy=y+Math.sin(s.angle)*s.dist;
    ctx.save();ctx.shadowBlur=15;ctx.shadowColor='#FAC775';
    ctx.strokeStyle='#FAC77544';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x,y,s.dist,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=s.hp/s.maxHp>.5?'#FAC775':'#FF6600';
    ctx.beginPath();ctx.arc(sx,sy,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#07071a';ctx.beginPath();ctx.arc(sx,sy,4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  });

  ctx.save();
  const pulseSz=boss.w/2+Math.sin(t*2)*6;
  ctx.shadowBlur=30+rage*30;ctx.shadowColor='#9900FF';
  ctx.fillStyle='#1a001a';ctx.beginPath();ctx.arc(x,y,pulseSz+10,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#9900FF';ctx.lineWidth=2+rage*3;ctx.beginPath();ctx.arc(x,y,pulseSz+12,0,Math.PI*2);ctx.stroke();
  const rings=3+Math.floor(rage*4);
  for(let i=0;i<rings;i++){
    const rr=pulseSz-i*12;if(rr<10)break;
    const alpha=(rings-i)/rings*.7;
    ctx.fillStyle=`rgba(${153+rage*102},0,${255-rage*100},${alpha})`;
    ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=rage>.7?'#FFD700':'#CC44FF';
  ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#07071a';ctx.beginPath();ctx.arc(x-16,y-14,8,0,Math.PI*2);ctx.arc(x+16,y-14,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rage>.5?'#FF0000':'#FF44FF';ctx.beginPath();ctx.arc(x-16,y-14,5,0,Math.PI*2);ctx.arc(x+16,y-14,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-16,y-14,2,0,Math.PI*2);ctx.arc(x+16,y-14,2,0,Math.PI*2);ctx.fill();
  const maw=0.4+rage*.7;
  ctx.fillStyle='#07071a';ctx.beginPath();ctx.ellipse(x,y+20,28,12*maw,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='#FF0044';
  for(let i=-3;i<=3;i++){ctx.beginPath();ctx.arc(x+i*8,y+20,2.5,0,Math.PI*2);ctx.fill();}
  for(let i=0;i<6;i++){
    const ta=t*.8+i*Math.PI/3;
    const tx=x+Math.cos(ta)*(pulseSz+30),ty=y+Math.sin(ta)*(pulseSz+30);
    ctx.strokeStyle='rgba(153,0,255,.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.restore();

  const bw=320,bh=8,bx=x-bw/2,by=y-boss.h/2-22;
  ctx.fillStyle='#1a001a';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=rage>.6?'#FF0044':rage>.3?'#CC44FF':'#9900FF';
  ctx.fillRect(bx,by,(bossHP/bossMaxHP)*bw,bh);
  ctx.strokeStyle='#9900FF66';ctx.lineWidth=.5;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#FAC775';ctx.font='bold 10px monospace';ctx.textAlign='center';
  ctx.fillText('THE VOID SOVEREIGN',x,by-3);ctx.textAlign='left';
}

function drawPlayerBullets(){
  bullets.forEach(b=>{
    ctx.save();ctx.shadowBlur=8;ctx.shadowColor=C.bullet;ctx.fillStyle=C.bullet;
    ctx.beginPath();ctx.roundRect(b.x-2.5,b.y-9,5,18,2);ctx.fill();ctx.restore();
  });
}

function drawEBullets(){
  const t=performance.now()/1000;
  eBullets.forEach(b=>{
    ctx.save();
    if(b.big){
      ctx.shadowBlur=28;ctx.shadowColor='#FF4400';
      const pulse=.6+Math.sin(t*8+b.x)*.4;
      ctx.strokeStyle=`rgba(255,100,0,${pulse})`;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(b.x,b.y,13,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#FF4400';ctx.beginPath();ctx.arc(b.x,b.y,9,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FFEE88';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,1.5,0,Math.PI*2);ctx.fill();
    } else if(b.void){
      ctx.shadowBlur=22;ctx.shadowColor='#9900FF';
      const p2=.5+Math.sin(t*10+b.y)*.5;
      ctx.strokeStyle=`rgba(153,0,255,${p2})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b.x,b.y,10,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#6600AA';ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FF00FF';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
    } else {
      ctx.shadowBlur=18;ctx.shadowColor='#FF6600';
      ctx.fillStyle='rgba(255,100,0,0.25)';ctx.beginPath();ctx.arc(b.x,b.y,9,0,Math.PI*2);ctx.fill();
      const s=6;
      ctx.fillStyle='#FF8800';ctx.beginPath();ctx.moveTo(b.x,b.y-s);ctx.lineTo(b.x+s*.7,b.y);ctx.lineTo(b.x,b.y+s);ctx.lineTo(b.x-s*.7,b.y);ctx.closePath();ctx.fill();
      ctx.fillStyle='#FFE066';ctx.beginPath();ctx.moveTo(b.x,b.y-s*.45);ctx.lineTo(b.x+s*.3,b.y);ctx.lineTo(b.x,b.y+s*.45);ctx.lineTo(b.x-s*.3,b.y);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  });
}

function drawLaser(){
  if(!laserBeam||laserTimer<=0)return;
  const a=laserTimer/22;
  ctx.save();ctx.globalAlpha=a;ctx.shadowBlur=20;ctx.shadowColor='#D4537E';ctx.strokeStyle='#D4537E';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(laserBeam.x,laserBeam.y);ctx.lineTo(laserBeam.x,0);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(laserBeam.x,laserBeam.y);ctx.lineTo(laserBeam.x,0);ctx.stroke();

}

function drawPowerups(){
  powerups.forEach(pu=>{
    if(pu.collected)return;
    const col=C.pu[pu.type]||'#fff';
    const by=pu.y+Math.sin(pu.bob)*3;
    ctx.save();ctx.shadowBlur=10;ctx.shadowColor=col;

    ctx.beginPath();ctx.roundRect(pu.x-14,by-12,28,24,5);ctx.fill();ctx.stroke();
    ctx.fillStyle=col;ctx.font='10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText({triple:'3x',rapid:'⚡',spread:'⬡',shield:'🛡',bomb:'💣',laser:'🔴'}[pu.type]||'?',pu.x,by);

function drawParticles(){
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+.5,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

function drawGround(){
  ctx.fillStyle='rgba(95,181,165,.07)';ctx.fillRect(0,H-38,W,38);
  ctx.strokeStyle='rgba(93,202,165,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,H-38);ctx.lineTo(W,H-38);ctx.stroke();
}

function draw(dt){
  drawBg();drawStars(dt||0);
  if(!bossActive)enemies.forEach(e=>drawEnemy(e));
  if(bossActive)drawBoss();
  drawPlayerBullets();drawEBullets();drawPowerups();drawParticles();drawLaser();drawPlayer(player);drawGround();
  if(screenFlash>0){ctx.fillStyle=screenFlashCol;ctx.globalAlpha=screenFlash/14*.4;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;screenFlash--;}
  if(waveTransition){
    ctx.fillStyle='rgba(7,7,26,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='500 24px monospace';ctx.textAlign='center';
    ctx.fillText(waveTransition==='clear'?'LEVEL '+currentLevel+' CLEARED!':'LEVEL '+currentLevel,W/2,H/2);
    ctx.font='12px monospace';ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.fillText(waveTransition==='clear'?'Preparing next level...':'Get ready!',W/2,H/2+28);
    ctx.textAlign='left';
  }
}

// ────────────────── UPDATE ──────────────────
function gameLoop(ts){
  if(gstate!=='playing'){lastTime=ts;return;}
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  update(dt);draw(dt);
  animId=requestAnimationFrame(gameLoop);
}

function update(dt){
  const sp=dt/16.67;
  const def=levelDef(currentLevel);
  if(player.invincible>0)player.invincible--;
  if(keys['ArrowLeft']||keys['a']||keys['A'])player.x=Math.max(player.w/2,player.x-player.speed*sp);
  if(keys['ArrowRight']||keys['d']||keys['D'])player.x=Math.min(W-player.w/2,player.x+player.speed*sp);
  if(shootCD>0)shootCD-=sp;
  if((keys[' ']||keys['ArrowUp']||keys['w']||keys['W'])&&shootCD<=0){fireBullet();shootCD=activePowerups.rapid?6:13;}
  if(mobileShootHeld){mobileShootTimer-=sp;if(mobileShootTimer<=0){fireBullet();mobileShootTimer=activePowerups.rapid?6:13;}}
  if(laserTimer>0){
    laserTimer-=sp;if(laserBeam)laserBeam.x=player.x;
    if(!bossActive)enemies.forEach(e=>{if(!e.alive)return;if(Math.abs(laserBeam.x-e.x)<e.w/2+4){e.hp-=.25*sp;if(e.hp<=0){e.alive=false;addScore(e.type*10);bumpCombo();spawnParticles(e.x,e.y,e.col||C.e1);maybeDrop(e.x,e.y);}}});
    if(bossActive&&boss){
      if(Math.abs(laserBeam.x-boss.x)<boss.w/2+6){bossHP-=1.8*sp;spawnParticles(boss.x,boss.y,'#D4537E',2);}
      ultimateSatellites.forEach(s=>{
        if(!s.alive)return;
        const sx=boss.x+Math.cos(s.angle)*s.dist,sy=boss.y+Math.sin(s.angle)*s.dist;
        if(Math.abs(laserBeam.x-sx)<12){s.hp-=.8*sp;if(s.hp<=0){s.alive=false;spawnParticles(sx,sy,'#FAC775',14);addScore(80);bumpCombo();}}
      });
    }
    if(laserTimer<=0)laserBeam=null;
  }
  bullets=bullets.filter(b=>{b.x+=(b.vx||0)*sp;b.y+=b.vy*sp;return b.y>-20&&b.x>-10&&b.x<W+10;});
  eBullets=eBullets.filter(b=>{b.x+=b.vx*sp;b.y+=b.vy*sp;return b.y<H+20&&b.x>-20&&b.x<W+20;});
  if(comboTimer>0){comboTimer-=sp;if(comboTimer<=0){combo=1;updateHUD();document.getElementById('cdsp').style.opacity='0';}}
  if(!bossActive)updateEnemies(sp,def);
  else updateBoss(sp,def);
  checkBulletHits();updatePowerups(sp);updateParticles(sp);checkPlayerHit();
  if(!bossActive&&enemies.filter(e=>e.alive).length===0&&!waveTransition)levelCleared();
}

function updateEnemies(sp,def){
  const alive=enemies.filter(e=>e.alive);if(!alive.length)return;
  eMoveTimer+=sp;
  const everyN=Math.max(5,36-currentLevel*1.1);
  if(eMoveTimer>=everyN){
    eMoveTimer=0;
    const atL=alive.some(e=>e.x-e.w/2<=5),atR=alive.some(e=>e.x+e.w/2>=W-5);
    if((eDir===1&&atR)||(eDir===-1&&atL)){enemies.forEach(e=>{if(e.alive)e.y+=16;});eDir*=-1;}
    else{const step=12+currentLevel*.6;enemies.forEach(e=>{if(e.alive){e.x+=eDir*step;e.wobble+=.4;}});}
  }
  if(alive.some(e=>e.y+e.h/2>=H-48)){endGame(false);return;}
  eBulletTimer+=sp;
  const shootEvery=Math.max(18,72-currentLevel*4);
  if(eBulletTimer>=shootEvery){
    eBulletTimer=0;
    const cols={};
    alive.forEach(e=>{const cx=Math.round(e.x/50);if(!cols[cx]||cols[cx].y<e.y)cols[cx]=e;});
    const shooters=Object.values(cols);
    const count=Math.min(1+Math.floor(currentLevel/4),shooters.length,5);
    for(let i=0;i<count;i++){
      const s=shooters[Math.floor(Math.random()*shooters.length)];if(!s)continue;
      const dx=player.x-s.x,dy=player.y-s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const spd=2.5+currentLevel*.18;
      eBullets.push({x:s.x,y:s.y+s.h/2,vx:(dx/d)*spd,vy:(dy/d)*spd,big:false});
    }
  }
}

function updateBoss(sp,def){
  if(!boss)return;
  boss.moveTimer=(boss.moveTimer||0)+sp;
  boss.x+=boss.dir*boss.speed*sp;
  if(boss.x+boss.w/2>W-8||boss.x-boss.w/2<8)boss.dir*=-1;
  const rage=1-bossHP/bossMaxHP;
  boss.shootTimer+=sp;
  const shootRate=Math.max(12,50-currentLevel*1.5-rage*20);

  if(def.isUltimate){
    updateUltimateBoss(sp,rage,shootRate);return;
  }

  if(boss.shootTimer>=shootRate){
    boss.shootTimer=0;
    const bossNum=boss.bossNum||1;
    const patterns=[
      ()=>{const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.sqrt(dx*dx+dy*dy)||1;eBullets.push({x:boss.x,y:boss.y+boss.h/2,vx:(dx/d)*4.5,vy:(dy/d)*4.5,big:false});},
      ()=>{for(let i=-2;i<=2;i++)eBullets.push({x:boss.x,y:boss.y+boss.h/2,vx:i*1.8,vy:4.5,big:false});},
      ()=>{eBullets.push({x:boss.x,y:boss.y+boss.h/2,vx:0,vy:5.5,big:true});},
      ()=>{for(let a=0;a<Math.PI*2;a+=Math.PI/(3+bossNum))eBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,big:false});},
      ()=>{for(let i=0;i<3;i++)eBullets.push({x:boss.x+(i-1)*30,y:boss.y+boss.h/2,vx:(player.x-boss.x-(i-1)*30)/(Math.abs(player.y-boss.y)||1)*3,vy:4,big:false});},
    ];
    const numP=Math.min(rage>.6?5:rage>.3?4:2+Math.floor(bossNum/2),patterns.length);
    patterns[Math.floor(Math.random()*numP)]();
    if(rage>.5){const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.sqrt(dx*dx+dy*dy)||1;eBullets.push({x:boss.x-35,y:boss.y+boss.h/2,vx:(dx/d)*3.8,vy:(dy/d)*3.8,big:false});}
  }
  if(bossHP<=0)bossDefeated(def);
}

function updateUltimateBoss(sp,rage,shootRate){
  ultimateSatellites.forEach(s=>{
    if(s.alive){s.angle+=s.orbitSpeed*(1+rage*.8)*sp;if(s.hp<=0){s.alive=false;spawnParticles(boss.x+Math.cos(s.angle)*s.dist,boss.y+Math.sin(s.angle)*s.dist,'#FAC775',18);addScore(100);}}
  });
  const liveSats=ultimateSatellites.filter(s=>s.alive).length;
  const allSatsDead=liveSats===0;
  ultimatePhase=allSatsDead?(rage>.6?3:rage>.3?2:1):0;
  ultimateAngle+=.008*sp*(1+rage);

  if(boss.shootTimer>=shootRate){
    boss.shootTimer=0;
    const phase=ultimatePhase;
    if(phase===0){
      ultimateSatellites.forEach(s=>{
        if(!s.alive)return;
        const sx=boss.x+Math.cos(s.angle)*s.dist,sy=boss.y+Math.sin(s.angle)*s.dist;
        const dx=player.x-sx,dy=player.y-sy,d=Math.sqrt(dx*dx+dy*dy)||1;
        eBullets.push({x:sx,y:sy,vx:(dx/d)*3.5,vy:(dy/d)*3.5,big:false,void:false});
      });
    }
    if(phase>=1){
      for(let a=0;a<Math.PI*2;a+=Math.PI/5)eBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a+ultimateAngle)*4,vy:Math.sin(a+ultimateAngle)*4,void:true,big:false});
    }
    if(phase>=2){
      const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      eBullets.push({x:boss.x,y:boss.y,vx:(dx/d)*6,vy:(dy/d)*6,big:true});
      for(let i=-1;i<=1;i++)eBullets.push({x:boss.x+i*40,y:boss.y+boss.h/2,vx:i*.5,vy:5,void:true,big:false});
    }
    if(phase>=3){
      for(let a=0;a<Math.PI*2;a+=Math.PI/8)eBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,void:true,big:false});
      eBullets.push({x:boss.x,y:boss.y,vx:0,vy:7,big:true});
    }
  }
  if(bossHP<=0)bossDefeated(levelDef(currentLevel));
}

function checkBulletHits(){
  if(!bossActive){
    bullets.forEach(b=>{
      if(b.y<-20)return;
      enemies.forEach(e=>{
        if(!e.alive||b.y<-20)return;
        const ey=e.y+Math.sin(e.wobble)*2.5;
        if(Math.abs(b.x-e.x)<e.w/2+5&&Math.abs(b.y-ey)<e.h/2+5){
          b.y=-999;e.hp--;spawnParticles(e.x,ey,e.col||C.e1,e.hp>0?5:12);
          if(e.hp<=0){e.alive=false;addScore(e.type*10);bumpCombo();maybeDrop(e.x,ey);}
        }
      });
    });
  } else if(boss){
    bullets.forEach(b=>{
      if(b.y<-20)return;
      const def=levelDef(currentLevel);
      if(def.isUltimate){
        ultimateSatellites.forEach(s=>{
          if(!s.alive||b.y<-20)return;
          const sx=boss.x+Math.cos(s.angle)*s.dist,sy=boss.y+Math.sin(s.angle)*s.dist;
          if(Math.abs(b.x-sx)<14&&Math.abs(b.y-sy)<14){b.y=-999;s.hp--;spawnParticles(sx,sy,'#FAC775',5);if(s.hp<=0){s.alive=false;spawnParticles(sx,sy,'#FAC775',16);addScore(100);bumpCombo();}}
        });
        if(b.y>-20&&Math.abs(b.x-boss.x)<boss.w/2+6&&Math.abs(b.y-boss.y)<boss.h/2+6){
          b.y=-999;bossHP--;if(Math.random()<.25)spawnParticles(b.x,b.y,'#9900FF',5);
        }
      } else {
        if(Math.abs(b.x-boss.x)<boss.w/2+6&&Math.abs(b.y-boss.y)<boss.h/2+6){
          b.y=-999;bossHP--;if(Math.random()<.3)spawnParticles(b.x,b.y,'#FAC775',4);
        }
      }
    });
  }
}

function updatePowerups(sp){
  powerups.forEach(pu=>{
    if(pu.collected)return;
    pu.y+=pu.vy*sp;pu.bob+=.04*sp;pu.life-=sp;if(pu.life<=0){pu.collected=true;return;}
    if(Math.abs(pu.x-player.x)<24&&Math.abs(pu.y-player.y)<24){
      pu.collected=true;
      if(pu.type==='shield')shield=Math.min(100,shield+45);
      else{activePowerups[pu.type]=true;if(['laser','triple','spread','rapid'].includes(pu.type))setTimeout(()=>{delete activePowerups[pu.type];updateHUD();},9000);}
      spawnParticles(pu.x,pu.y,C.pu[pu.type],16);screenFlash=5;screenFlashCol=C.pu[pu.type];updateHUD();
    }
  });
  powerups=powerups.filter(p=>!p.collected);
}

function updateParticles(sp){
  particles=particles.filter(p=>{p.x+=p.vx*sp;p.y+=p.vy*sp;p.vy+=.06*sp;p.life-=.022*sp;p.vx*=.97;return p.life>0;});
}

function checkPlayerHit(){
  if(player.invincible>0)return;
  eBullets.forEach(b=>{
    if(b.y<-20||b.y>H+10)return;
    const rad=b.big?11:b.void?9:6;
    if(Math.abs(b.x-player.x)<player.w/2-3+rad&&Math.abs(b.y-player.y)<player.h/2-3+rad){
      b.y=9999;
      if(shield>0){
        shield=Math.max(0,shield-(b.big?38:b.void?28:18));
        screenFlash=5;screenFlashCol=C.shield;spawnParticles(b.x,b.y,C.shield,8);updateHUD();player.invincible=20;
      } else {
        lives--;updateHUD();spawnParticles(player.x,player.y,C.player,22);
        screenFlash=10;screenFlashCol='#fff';player.invincible=90;
        if(lives<=0){endGame(false);}
      }
    }
  });
}

function levelCleared(){
  clearedLevels.add(currentLevel);waveTransition='clear';gstate='levelclear';
  cancelAnimationFrame(animId);draw(0);
  const isLast=currentLevel===30;
  document.getElementById('ov').style.display='flex';
  document.getElementById('ot').textContent=isLast?'YOU WIN THE GAME!':'LEVEL '+currentLevel+' CLEARED!';
  document.getElementById('ot').style.color='#5DCAA5';
  document.getElementById('os').innerHTML='Score: '+score+'<br>'+(isLast?'You defeated the Void Sovereign!':'Next: Level '+(currentLevel+1)+' — '+(levelDef(currentLevel+1)||{name:''}).name);
  const btn=document.getElementById('ob');
  if(isLast){btn.textContent='PLAY AGAIN';btn.onclick=()=>startLevel(1);}
  else{btn.textContent='NEXT LEVEL ▶';btn.onclick=()=>startLevel(currentLevel+1);}
  btn.style.background='#1D9E75';
}

function bossDefeated(def){
  clearedLevels.add(currentLevel);
  screenFlash=20;screenFlashCol=def.isUltimate?'#9900FF':'#FAC775';
  for(let i=0;i<35;i++)spawnParticles(boss.x+rnd(-60,60),boss.y+rnd(-50,50),def.isUltimate?'#9900FF':'#E24B4A',4);
  addScore(def.isUltimate?5000:300+currentLevel*60);bumpCombo();
  boss=null;bossActive=false;
  for(let i=0;i<3;i++)powerups.push({x:W/2+(i-1)*60,y:H/2,vy:.8,type:PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)],bob:0,life:600,collected:false});
  draw(0);
  setTimeout(()=>levelCleared(),400);
}

function endGame(won){
  gstate='gameover';cancelAnimationFrame(animId);
  document.getElementById('ot').textContent='GAME OVER';
  document.getElementById('ot').style.color='#F09595';
  document.getElementById('os').innerHTML='Score: '+score+'&nbsp;|&nbsp;Hi: '+hiScore+'<br>Level '+currentLevel+' — '+levelDef(currentLevel).name;
  const btn=document.getElementById('ob');btn.textContent='RETRY LEVEL';btn.style.background='#A32D2D';
  btn.onclick=()=>startLevel(currentLevel);
  document.getElementById('ov').style.display='flex';
}

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' ')e.preventDefault();
  if(e.key==='b'||e.key==='B')doBomb();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

const bsh=document.getElementById('bsh');
bsh.addEventListener('mousedown',()=>{mobileShootHeld=true;mobileShootTimer=0;});
bsh.addEventListener('touchstart',e=>{e.preventDefault();mobileShootHeld=true;mobileShootTimer=0;},{passive:false});
['mouseup','mouseleave','touchend'].forEach(ev=>bsh.addEventListener(ev,()=>mobileShootHeld=false));
document.getElementById('bl').addEventListener('touchend',()=>{keys['ArrowLeft']=false;});
document.getElementById('br').addEventListener('touchend',()=>{keys['ArrowRight']=false;});

function renderMenuCanvas(){
  ctx.fillStyle='#07071a';ctx.fillRect(0,0,W,H);
  if(stars)stars.forEach(s=>{s.y=(s.y+s.spd*.5)%H;ctx.globalAlpha=s.alpha;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;if(gstate==='menu')requestAnimationFrame(renderMenuCanvas);
}

initStars('#07071a','#fff');
showMenu();
</script>
